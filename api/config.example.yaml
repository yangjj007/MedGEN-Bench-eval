# Copy to api/config.aihubmix.yaml (or another ignored local filename) before use.
# `${AIHUBMIX_API_KEY}` is resolved at runtime; never put a real key in Git.
api_key: "${AIHUBMIX_API_KEY}"
base_url: "https://aihubmix.com/v1"
model_name: ""
max_retries: 3
retry_delay: 2
timeout: 120
temperature: 0.4

# Optional independent settings for an image endpoint. Omit these keys when
# the same gateway and credential serve VLM and image requests.
# image_base_url: "https://aihubmix.com/v1"
