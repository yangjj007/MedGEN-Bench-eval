# Local Qwen Image Edit configuration for qwen_image_edit_serve.sh.
api_key: "EMPTY"
image_api_key: "EMPTY"
base_url: "http://127.0.0.1:8001/v1"
image_base_url: "http://127.0.0.1:8001/v1"
model_name: "Qwen/Qwen-Image-Edit"
image_edit_model_name: "Qwen/Qwen-Image-Edit"
max_retries: 1
retry_delay: 2
image_timeout: 1800
image_edit_endpoint: "/images/edits"
edit_request_defaults:
  n: 1
  response_format: "url"
  size: "512x512"
